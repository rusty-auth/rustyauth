name: rustyauth-integration

services:
  # Both SableDB services share one image tag: locally `--build` still builds it (once),
  # while CI pre-builds the tag with a warm layer cache and starts compose without --build.
  source-sabledb:
    image: rustyauth-sabledb:ci
    build:
      context: .
      dockerfile: sabledb/Dockerfile
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "/usr/local/bin/container-healthcheck", "redis", "127.0.0.1:6379"]
      interval: 2s
      timeout: 2s
      retries: 60

  destination-sabledb:
    image: rustyauth-sabledb:ci
    build:
      context: .
      dockerfile: sabledb/Dockerfile
    ports:
      - "127.0.0.1:16380:6379"
    healthcheck:
      test: ["CMD", "/usr/local/bin/container-healthcheck", "redis", "127.0.0.1:6379"]
      interval: 2s
      timeout: 2s
      retries: 60

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rustyauth-test
      MINIO_ROOT_PASSWORD: rustyauth-test-secret
    ports:
      - "127.0.0.1:19000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 60

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 rustyauth-test rustyauth-test-secret
        && mc mb --ignore-existing --with-lock local/rustyauth-integration
        && mc retention set --default compliance 90d local/rustyauth-integration

  greptimedb:
    image: greptime/greptimedb:v1.1.4@sha256:9726587eac95d0360755254cd59a528dbf48abfdf268478aea6a644f62afe44c
    command:
      - standalone
      - start
      - --http-addr
      - 0.0.0.0:4000
      - --user-provider
      - static_user_provider:cmd:rustyauth=rustyauth-test-password
    environment:
      GREPTIMEDB_STANDALONE__ENABLE_TELEMETRY: "false"
      RUSTYAUTH_GREPTIME_HEALTH_USER: rustyauth
      RUSTYAUTH_GREPTIME_HEALTH_PASSWORD: rustyauth-test-password
    ports:
      - "127.0.0.1:14000:4000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          credentials="$$(printf '%s' "$${RUSTYAUTH_GREPTIME_HEALTH_USER}:$${RUSTYAUTH_GREPTIME_HEALTH_PASSWORD}" | base64)" &&
          curl --fail --silent --header "Authorization: Basic $${credentials}"
          --data 'sql=SELECT 1' http://127.0.0.1:4000/v1/sql >/dev/null
      interval: 2s
      timeout: 2s
      retries: 60
