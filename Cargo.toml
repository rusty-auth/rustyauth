[package]
name = "rustyauth"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"
description = "RustyAuth: passkey-first authentication built in Rust on SableDB"
readme = "README.md"
repository = "https://github.com/rusty-auth/rustyauth"
homepage = "https://rustyauth.dev"
documentation = "https://rustyauth.dev/docs/"
keywords = ["authentication", "passkeys", "webauthn", "sabledb", "jwt"]
categories = ["authentication", "web-programming::http-server"]
publish = false

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
arrow-array = "59.2"
arrow-json = "59.2"
arrow-schema = "59.2"
async-stream = "0.3"
aws-config = "1.8"
aws-credential-types = "1.2"
aws-sdk-kms = { version = "1.114", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
# The default feature set turns on `rustls`, which is the legacy hyper 0.14 connector built on
# rustls 0.21 and its unmaintained rustls-webpki 0.101 (RUSTSEC-2026-0098/0099/0104). Selecting the
# remaining defaults by hand keeps the backup client on the single modern rustls 0.23 stack.
aws-sdk-s3 = { version = "1.141", default-features = false, features = [
    "default-https-client",
    "http-1x",
    "rt-tokio",
    "sigv4a",
] }
axum = "0.8"
base64 = "0.22"
bytes = "1"
buffa = "0.8.1"
connectrpc = { version = "0.8.1", features = ["axum", "client", "client-tls"] }
futures = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hmac = "0.12"
humantime = "2"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
parquet = { version = "59.2", default-features = false, features = ["arrow", "zstd"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
redis = { version = "1.5", default-features = false, features = ["aio", "connection-manager", "tokio-rustls-comp"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "serde"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["catch-panic", "cors", "fs", "limit", "request-id", "sensitive-headers", "set-header", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["danger-allow-state-serialisation", "danger-credential-internals"] }
webpki-roots = "1"
zeroize = "1"
zstd = "0.13"

[build-dependencies]
connectrpc-build = "=0.8.0"
protoc-bin-vendored = "3"

[dev-dependencies]
# Encodes the CBOR attestation objects a real authenticator would produce, so the
# WebAuthn ceremonies can be exercised end to end rather than only at their edges.
ciborium = "0.2"
connectrpc = { version = "0.8.1", features = ["client"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
# Unwinding, not aborting. Under `panic = "abort"` a panic anywhere — including
# inside a dependency, which is exactly what RUSTSEC-2026-0104 was — terminates the
# process and drops every concurrent request. Unwinding lets `CatchPanicLayer` turn
# one panicking request into one 500 while the service keeps authenticating.
# Durable state lives in SableDB, so an unwound request leaves nothing inconsistent.
panic = "unwind"
strip = "symbols"
