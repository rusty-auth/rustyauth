version: v2
modules:
  - path: proto
    name: buf.build/rusty-auth/rustyauth
lint:
  use:
    - STANDARD
  except:
    # ConnectRPC permits resource messages as unary responses. RustyAuth uses
    # that shape for mutations so clients can update their cache directly.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
