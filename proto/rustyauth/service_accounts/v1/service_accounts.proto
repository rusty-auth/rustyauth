syntax = "proto3";

package rustyauth.service_accounts.v1;

// Manages non-human principals and independently rotatable credentials.
// Secret values appear only in create responses.
service ServiceAccountService {
  rpc ListServiceAccounts(ListServiceAccountsRequest) returns (ListServiceAccountsResponse);
  rpc GetServiceAccount(GetServiceAccountRequest) returns (ServiceAccount);
  rpc CreateServiceAccount(CreateServiceAccountRequest) returns (ServiceAccount);
  rpc UpdateServiceAccount(UpdateServiceAccountRequest) returns (ServiceAccount);
  rpc CreateCredential(CreateCredentialRequest) returns (CreateCredentialResponse);
  rpc RevokeCredential(RevokeCredentialRequest) returns (RevokeCredentialResponse);
  rpc ExchangeCredential(ExchangeCredentialRequest) returns (ExchangeCredentialResponse);
}

enum ServiceAccountStatus {
  SERVICE_ACCOUNT_STATUS_UNSPECIFIED = 0;
  SERVICE_ACCOUNT_STATUS_ACTIVE = 1;
  SERVICE_ACCOUNT_STATUS_DISABLED = 2;
}

message ServiceAccountCredential {
  string id = 1;
  string name = 2;
  string secret_hint = 3;
  string created_at = 4;
  string expires_at = 5;
  string last_used_at = 6;
  string revoked_at = 7;
}

message ServiceAccount {
  string id = 1;
  string name = 2;
  string description = 3;
  ServiceAccountStatus status = 4;
  repeated string scopes = 5;
  repeated ServiceAccountCredential credentials = 6;
  string created_at = 7;
  string created_by = 8;
  string last_used_at = 9;
}

message ListServiceAccountsRequest {
  string query = 1;
  ServiceAccountStatus status = 2;
  uint32 page_size = 3;
  string page_token = 4;
}

message ListServiceAccountsResponse {
  repeated ServiceAccount service_accounts = 1;
  string next_page_token = 2;
}

message GetServiceAccountRequest {
  string service_account_id = 1;
}

message CreateServiceAccountRequest {
  string name = 1;
  string description = 2;
  repeated string scopes = 3;
}

message UpdateServiceAccountRequest {
  string service_account_id = 1;
  string name = 2;
  string description = 3;
  ServiceAccountStatus status = 4;
  repeated string scopes = 5;
  string reason = 6;
}

message CreateCredentialRequest {
  string service_account_id = 1;
  string name = 2;
  string expires_at = 3;
}

message CreateCredentialResponse {
  ServiceAccountCredential credential = 1;
  // High-entropy bearer credential shown exactly once.
  string secret = 2;
}

message RevokeCredentialRequest {
  string service_account_id = 1;
  string credential_id = 2;
  string reason = 3;
}

message RevokeCredentialResponse {}

message ExchangeCredentialRequest {
  string credential = 1;
  repeated string requested_scopes = 2;
}

message ExchangeCredentialResponse {
  string access_token = 1;
  string token_type = 2;
  uint32 expires_in_seconds = 3;
  repeated string scopes = 4;
}
