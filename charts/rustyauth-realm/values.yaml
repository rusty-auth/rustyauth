nameOverride: ""
fullnameOverride: ""
clusterDomain: cluster.local
imagePullSecrets: []

images:
  api:
    repository: ghcr.io/rusty-auth/rustyauth
    tag: v0.1.0
    digest: ""
    pullPolicy: IfNotPresent
  sabledb:
    repository: ghcr.io/rusty-auth/sabledb
    tag: v0.1.0
    digest: ""
    pullPolicy: IfNotPresent

config:
  existingConfigMap: ""
  existingConfigMapKey: config.yaml
  environment: production
  tenantId: example
  realmId: project-production
  publicIssuer: https://auth-api.example.com
  trustedProxyHops: 1
  relyingParty:
    id: app.example.com
    origin: https://app.example.com
    name: Example Account
  tokens:
    audience: example-api
    accessTtl: 5m
  sessions:
    idleTimeout: 30m
    absoluteTimeout: 7d
  events:
    retention: 90d
  signingKeys:
    rotateEvery: 30d
    prepublishFor: 10m
    overlapFor: 10m
    maintenanceInterval: 30s
  operators:
    bootstrapEmails: []

secrets:
  existingSecret: ""
  create: false
  values:
    masterKeyHex: ""
    bootstrapToken: ""
    eventRpcToken: ""
    identityRpcToken: ""
  extra: {}

api:
  replicaCount: 1
  logFilter: rustyauth=info,tower_http=info
  podAnnotations: {}
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

sabledb:
  podAnnotations: {}
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  persistence:
    enabled: true
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 5Gi
    retain: true

ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts:
    - host: auth-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}
