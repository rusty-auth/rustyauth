{{- if and .Values.secrets.create .Values.secrets.existingSecret }}{{ fail "secrets.create and secrets.existingSecret are mutually exclusive" }}{{- end }}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rustyauth-fleet.secretName" . }}
  labels:
    {{- include "rustyauth-fleet.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_MASTER_KEY_HEX: {{ required "secrets.values.masterKeyHex is required when secrets.create=true" .Values.secrets.values.masterKeyHex | quote }}
  BOOTSTRAP_TOKEN: {{ required "secrets.values.bootstrapToken is required when secrets.create=true" .Values.secrets.values.bootstrapToken | quote }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
