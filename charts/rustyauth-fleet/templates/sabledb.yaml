apiVersion: v1
kind: Service
metadata:
  name: {{ include "rustyauth-fleet.fullname" . }}-sabledb
  labels:
    {{- include "rustyauth-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: sabledb
spec:
  type: ClusterIP
  ports:
    - { name: redis, port: 6379, targetPort: redis, protocol: TCP }
  selector:
    app.kubernetes.io/name: {{ include "rustyauth-fleet.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sabledb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rustyauth-fleet.fullname" . }}-sabledb
  labels:
    {{- include "rustyauth-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: sabledb
spec:
  serviceName: {{ include "rustyauth-fleet.fullname" . }}-sabledb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rustyauth-fleet.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sabledb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rustyauth-fleet.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: sabledb
      {{- with .Values.sabledb.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sabledb
          image: {{ include "rustyauth-fleet.image" .Values.images.sabledb | quote }}
          imagePullPolicy: {{ .Values.images.sabledb.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: redis, containerPort: 6379, protocol: TCP }
          startupProbe:
            exec: { command: ["/usr/local/bin/container-healthcheck", "redis", "127.0.0.1:6379"] }
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            exec: { command: ["/usr/local/bin/container-healthcheck", "redis", "127.0.0.1:6379"] }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec: { command: ["/usr/local/bin/container-healthcheck", "redis", "127.0.0.1:6379"] }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.sabledb.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/sabledb }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          {{- if .Values.sabledb.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "rustyauth-fleet.fullname" . }}-sabledb
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
