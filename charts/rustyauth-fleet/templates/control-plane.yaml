apiVersion: v1
kind: Service
metadata:
  name: {{ include "rustyauth-fleet.fullname" . }}-control-plane
  labels:
    {{- include "rustyauth-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 8080, targetPort: http, protocol: TCP }
  selector:
    app.kubernetes.io/name: {{ include "rustyauth-fleet.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control-plane
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rustyauth-fleet.fullname" . }}-control-plane
  labels:
    {{- include "rustyauth-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rustyauth-fleet.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rustyauth-fleet.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: control-plane
      annotations:
        checksum/config: {{ ternary (printf "%s/%s" .Values.config.existingConfigMap .Values.config.existingConfigMapKey) (include "rustyauth-fleet.config" .) (ne .Values.config.existingConfigMap "") | sha256sum }}
        {{- with .Values.controlPlane.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: control-plane
          image: {{ include "rustyauth-fleet.image" .Values.images.controlPlane | quote }}
          imagePullPolicy: {{ .Values.images.controlPlane.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          envFrom:
            - secretRef:
                name: {{ include "rustyauth-fleet.secretName" . }}
          env:
            - name: RUST_LOG
              value: {{ .Values.controlPlane.logFilter | quote }}
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/rustyauth/config.yaml, subPath: config.yaml, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: {{ include "rustyauth-fleet.configMapName" . }}
            items:
              - key: {{ .Values.config.existingConfigMapKey }}
                path: config.yaml
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
