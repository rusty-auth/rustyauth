name: Native preview qualification

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

concurrency:
  group: native-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview-package-qualification:
    name: ${{ matrix.name }} preview package
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            package_type: macos
          - name: Windows
            os: windows-2025
            package_type: msi
          - name: Linux
            os: ubuntu-24.04
            package_type: deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: console
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev
      - run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Build host installer
        run: >-
          dx --locked bundle --desktop --release --no-default-features
          --features "desktop bundle" --debug-symbols=false
          --package-types "${{ matrix.package_type }}"
      - name: Upload unsigned qualification package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustyauth-console-${{ runner.os }}-${{ runner.arch }}-preview-unsigned
          path: console/target/dx/rustyauth-console/bundle/**
          if-no-files-found: error
          retention-days: 7
