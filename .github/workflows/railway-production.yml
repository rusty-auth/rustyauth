name: Railway production deployment

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full main-branch commit SHA to deploy; blank selects the current main tip
        required: false
        type: string
      allow_non_tip:
        description: Allow an older main commit for an explicit rollback
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: true

jobs:
  prepare:
    name: Select verified main commit
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
      sha: ${{ steps.release.outputs.sha }}
      previous_sha: ${{ steps.release.outputs.previous_sha }}
      api_image: ${{ steps.images.outputs.api_image }}
      dashboard_image: ${{ steps.images.outputs.dashboard_image }}
      sabledb_image: ${{ steps.images.outputs.sabledb_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.9.3
      - id: release
        name: Reject stale or non-main automatic deployments
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          ALLOW_NON_TIP: ${{ inputs.allow_non_tip }}
        run: |
          git fetch --no-tags origin main
          tip="$(git rev-parse origin/main)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            candidate="$(jq -r '.workflow_run.head_sha' "${GITHUB_EVENT_PATH}")"
            allow_non_tip=false
          else
            candidate="${REQUESTED_SHA:-${tip}}"
            allow_non_tip="${ALLOW_NON_TIP:-false}"
          fi
          if [[ ! "${candidate}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::deployment commit must be a full lowercase SHA"
            exit 1
          fi
          git cat-file -e "${candidate}^{commit}"
          if ! git merge-base --is-ancestor "${candidate}" "${tip}"; then
            echo "::error::deployment commit is not on main"
            exit 1
          fi
          previous_sha="$(
            gh api \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/railway-production.yml/runs?branch=main&status=success&per_page=20" \
              | jq -r --arg candidate "${candidate}" \
                '[.workflow_runs[] | select(.head_sha != $candidate)][0].head_sha // empty'
          )"
          previous_sha="${previous_sha:-0000000000000000000000000000000000000000}"
          echo "previous_sha=${previous_sha}" >> "${GITHUB_OUTPUT}"
          if [[ "${candidate}" != "${tip}" && "${allow_non_tip}" != "true" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
              echo "Skipping stale successful CI result ${candidate}; main is now ${tip}."
              echo "deploy=false" >> "${GITHUB_OUTPUT}"
              echo "sha=${candidate}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "::error::an older main commit requires allow_non_tip for an explicit rollback"
            exit 1
          fi
          echo "deploy=true" >> "${GITHUB_OUTPUT}"
          echo "sha=${candidate}" >> "${GITHUB_OUTPUT}"
      - id: images
        name: Select runtime images changed since the last successful deployment
        if: steps.release.outputs.deploy == 'true'
        env:
          BASE_SHA: ${{ steps.release.outputs.previous_sha }}
          HEAD_SHA: ${{ steps.release.outputs.sha }}
        run: >-
          deno run --allow-env=BASE_SHA,HEAD_SHA --allow-run=git
          scripts/ci-changes.ts >> "${GITHUB_OUTPUT}"

  publish-api:
    name: Publish API candidate
    needs: prepare
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest || steps.reuse.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - id: reuse
        name: Reuse the previously deployed API image
        if: needs.prepare.outputs.api_image != 'true'
        env:
          PREVIOUS_SHA: ${{ needs.prepare.outputs.previous_sha }}
        run: |
          digest="$(scripts/resolve-image-digest.sh ghcr.io/rusty-auth/rustyauth "${PREVIOUS_SHA}")"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.prepare.outputs.api_image == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        if: needs.prepare.outputs.api_image == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: ghcr.io/rusty-auth/rustyauth:main-${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=rustyauth-image
          cache-to: type=gha,scope=rustyauth-image,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: needs.prepare.outputs.api_image == 'true'
        with:
          cosign-release: v3.0.6
      - name: Sign API candidate by digest
        if: needs.prepare.outputs.api_image == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/rusty-auth/rustyauth@${DIGEST}"

  publish-dashboard:
    name: Publish dashboard candidate
    needs: prepare
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest || steps.reuse.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - id: reuse
        name: Reuse the previously deployed dashboard image
        if: needs.prepare.outputs.dashboard_image != 'true'
        env:
          PREVIOUS_SHA: ${{ needs.prepare.outputs.previous_sha }}
        run: |
          digest="$(scripts/resolve-image-digest.sh ghcr.io/rusty-auth/dashboard "${PREVIOUS_SHA}")"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.prepare.outputs.dashboard_image == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        if: needs.prepare.outputs.dashboard_image == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: ghcr.io/rusty-auth/dashboard:main-${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=dashboard-image
          cache-to: type=gha,scope=dashboard-image,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: needs.prepare.outputs.dashboard_image == 'true'
        with:
          cosign-release: v3.0.6
      - name: Sign dashboard candidate by digest
        if: needs.prepare.outputs.dashboard_image == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/rusty-auth/dashboard@${DIGEST}"

  publish-sabledb:
    name: Publish SableDB candidate
    needs: prepare
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest || steps.reuse.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - id: reuse
        name: Reuse the previously deployed SableDB image
        if: needs.prepare.outputs.sabledb_image != 'true'
        env:
          PREVIOUS_SHA: ${{ needs.prepare.outputs.previous_sha }}
        run: |
          digest="$(scripts/resolve-image-digest.sh ghcr.io/rusty-auth/sabledb "${PREVIOUS_SHA}")"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.prepare.outputs.sabledb_image == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        if: needs.prepare.outputs.sabledb_image == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: sabledb/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: ghcr.io/rusty-auth/sabledb:main-${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=sabledb-image
          cache-to: type=gha,scope=sabledb-image,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: needs.prepare.outputs.sabledb_image == 'true'
        with:
          cosign-release: v3.0.6
      - name: Sign SableDB candidate by digest
        if: needs.prepare.outputs.sabledb_image == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/rusty-auth/sabledb@${DIGEST}"

  verify-public-candidates:
    name: Verify candidates are anonymously pullable
    needs: [prepare, publish-api, publish-dashboard, publish-sabledb]
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Pull immutable manifests without registry credentials
        env:
          API_DIGEST: ${{ needs.publish-api.outputs.digest }}
          DASHBOARD_DIGEST: ${{ needs.publish-dashboard.outputs.digest }}
          SABLEDB_DIGEST: ${{ needs.publish-sabledb.outputs.digest }}
        run: |
          docker buildx imagetools inspect "ghcr.io/rusty-auth/rustyauth@${API_DIGEST}" >/dev/null
          docker buildx imagetools inspect "ghcr.io/rusty-auth/dashboard@${DASHBOARD_DIGEST}" >/dev/null
          docker buildx imagetools inspect "ghcr.io/rusty-auth/sabledb@${SABLEDB_DIGEST}" >/dev/null

  deploy:
    name: Roll out verified candidate
    needs: [prepare, publish-api, publish-dashboard, publish-sabledb, verify-public-candidates]
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: railway-production
      url: ${{ vars.RAILWAY_DASHBOARD_URL }}
    env:
      # Railway project tokens use RAILWAY_TOKEN. Keep the broader workspace
      # token confined to the template-publication job below.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
      RAILWAY_DASHBOARD_SERVICE_ID: ${{ vars.RAILWAY_DASHBOARD_SERVICE_ID }}
      RAILWAY_SABLEDB_SERVICE_ID: ${{ vars.RAILWAY_SABLEDB_SERVICE_ID }}
      RAILWAY_API_URL: ${{ vars.RAILWAY_API_URL }}
      RAILWAY_DASHBOARD_URL: ${{ vars.RAILWAY_DASHBOARD_URL }}
      RAILWAY_AGENT_SESSION: github-${{ github.run_id }}-${{ github.run_attempt }}
      RAILWAY_CLI_VERSION: 5.31.1
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      API_DIGEST: ${{ needs.publish-api.outputs.digest }}
      DASHBOARD_DIGEST: ${{ needs.publish-dashboard.outputs.digest }}
      SABLEDB_DIGEST: ${{ needs.publish-sabledb.outputs.digest }}
      SABLEDB_CHANGED: ${{ needs.prepare.outputs.sabledb_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.9.3
      - name: Verify pinned Railway CLI package
        run: test "$(npm view "@railway/cli@${RAILWAY_CLI_VERSION}" version)" = "${RAILWAY_CLI_VERSION}"
      - name: Install pinned Railway CLI
        run: npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"
      - name: Validate deployment target
        run: |
          required=(
            RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID
            RAILWAY_API_SERVICE_ID RAILWAY_DASHBOARD_SERVICE_ID RAILWAY_SABLEDB_SERVICE_ID
            RAILWAY_API_URL RAILWAY_DASHBOARD_URL API_DIGEST DASHBOARD_DIGEST SABLEDB_DIGEST
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub environment railway-production is missing ${name}"
              exit 1
            fi
          done
          [[ "${RAILWAY_API_URL}" == https://* ]]
          [[ "${RAILWAY_DASHBOARD_URL}" == https://* ]]
          railway service status \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT_ID}" \
            --service "${RAILWAY_API_SERVICE_ID}" --json >/dev/null
      - name: Create deployment receipt directory
        run: mkdir -p "${RUNNER_TEMP}/railway-receipts"
      - name: Capture the current browser origin configuration
        run: |
          railway variable list \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT_ID}" \
            --service "${RAILWAY_API_SERVICE_ID}" --json \
            | jq '{AUTH_ISSUER, WEBAUTHN_RP_ORIGIN, WEBAUTHN_RP_ID}' \
              > "${RUNNER_TEMP}/railway-receipts/browser-origin-before.json"
          jq --exit-status \
            '.AUTH_ISSUER and .WEBAUTHN_RP_ORIGIN and .WEBAUTHN_RP_ID' \
            "${RUNNER_TEMP}/railway-receipts/browser-origin-before.json" >/dev/null
      - name: Align the browser issuer and relying-party origin
        run: |
          dashboard_url="${RAILWAY_DASHBOARD_URL%/}"
          dashboard_host="${dashboard_url#https://}"
          if [[ "${dashboard_host}" == */* || -z "${dashboard_host}" ]]; then
            echo "::error::RAILWAY_DASHBOARD_URL must be an HTTPS origin without a path"
            exit 1
          fi
          railway variable set \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT_ID}" \
            --service "${RAILWAY_API_SERVICE_ID}" \
            --skip-deploys --json \
            "AUTH_TRUSTED_PROXY_HOPS=1" \
            "AUTH_BACKUP_STORAGE_PROFILE=portable" \
            "AUTH_BACKUP_SSE=provider" \
            "RUST_LOG=rustyauth=info,tower_http=info" \
            "AUTH_ISSUER=${dashboard_url}" \
            "WEBAUTHN_RP_ORIGIN=${dashboard_url}" \
            "WEBAUTHN_RP_ID=${dashboard_host}" >/dev/null
      - name: Deploy realm API and create the recovery point
        if: needs.prepare.outputs.api_image == 'true' || needs.prepare.outputs.sabledb_image == 'true'
        run: >-
          deno run --allow-env --allow-net --allow-run --allow-write="${RUNNER_TEMP}/railway-receipts"
          scripts/railway-rollout.ts
          --project "${RAILWAY_PROJECT_ID}"
          --environment "${RAILWAY_ENVIRONMENT_ID}"
          --service "${RAILWAY_API_SERVICE_ID}"
          --profile realm
          --image "ghcr.io/rusty-auth/rustyauth:main-${RELEASE_SHA}"
          --digest "${API_DIGEST}"
          --force "${SABLEDB_CHANGED}"
          --health-url "${RAILWAY_API_URL%/}/healthz"
          --health-url "${RAILWAY_API_URL%/}/readyz"
          --receipt "${RUNNER_TEMP}/railway-receipts/api-before-sable.json"
      - name: Require a fresh verified recovery point
        if: needs.prepare.outputs.api_image == 'true' || needs.prepare.outputs.sabledb_image == 'true'
        run: |
          deployment_id="$(jq -r '.deploymentId' "${RUNNER_TEMP}/railway-receipts/api-before-sable.json")"
          for attempt in {1..12}; do
            logs="$(railway logs "${deployment_id}" \
              --project "${RAILWAY_PROJECT_ID}" \
              --environment "${RAILWAY_ENVIRONMENT_ID}" \
              --service "${RAILWAY_API_SERVICE_ID}" \
              --lines 200 --json || true)"
            if jq --slurp --exit-status '
              any(.[]; (.message // "") | contains("encrypted backup created and verified")) or
              (
                any(.[]; (.message // "") | contains("\"formatVersion\": 3")) and
                any(.[]; (.message // "") | contains("\"objectKey\": \"rustyauth-backups/v3/")) and
                any(.[]; (.message // "") | contains("\"storageProfile\": \"portable\""))
              )' \
              <<<"${logs}" >/dev/null; then
              printf '%s\n' "${logs}" > \
                "${RUNNER_TEMP}/railway-receipts/backup-before-logs.json"
              exit 0
            fi
            if [[ "${attempt}" -lt 12 ]]; then
              sleep 5
            fi
          done
          echo "::error::candidate did not create and verify a fresh encrypted backup"
          exit 1
      - name: Deploy private SableDB
        if: needs.prepare.outputs.sabledb_image == 'true'
        run: >-
          deno run --allow-env --allow-net --allow-run --allow-write="${RUNNER_TEMP}/railway-receipts"
          scripts/railway-rollout.ts
          --project "${RAILWAY_PROJECT_ID}"
          --environment "${RAILWAY_ENVIRONMENT_ID}"
          --service "${RAILWAY_SABLEDB_SERVICE_ID}"
          --profile sabledb
          --image "ghcr.io/rusty-auth/sabledb:main-${RELEASE_SHA}"
          --digest "${SABLEDB_DIGEST}"
          --receipt "${RUNNER_TEMP}/railway-receipts/sabledb.json"
      - name: Restart the realm API after a datastore change
        if: needs.prepare.outputs.sabledb_image == 'true'
        run: >-
          deno run --allow-env --allow-net --allow-run --allow-write="${RUNNER_TEMP}/railway-receipts"
          scripts/railway-rollout.ts
          --project "${RAILWAY_PROJECT_ID}"
          --environment "${RAILWAY_ENVIRONMENT_ID}"
          --service "${RAILWAY_API_SERVICE_ID}"
          --profile realm
          --image "ghcr.io/rusty-auth/rustyauth:main-${RELEASE_SHA}"
          --digest "${API_DIGEST}"
          --force true
          --health-url "${RAILWAY_API_URL%/}/healthz"
          --health-url "${RAILWAY_API_URL%/}/readyz"
          --receipt "${RUNNER_TEMP}/railway-receipts/api-after-sable.json"
      - name: Deploy dashboard
        if: needs.prepare.outputs.dashboard_image == 'true'
        run: >-
          deno run --allow-env --allow-net --allow-run --allow-write="${RUNNER_TEMP}/railway-receipts"
          scripts/railway-rollout.ts
          --project "${RAILWAY_PROJECT_ID}"
          --environment "${RAILWAY_ENVIRONMENT_ID}"
          --service "${RAILWAY_DASHBOARD_SERVICE_ID}"
          --profile dashboard
          --image "ghcr.io/rusty-auth/dashboard:main-${RELEASE_SHA}"
          --digest "${DASHBOARD_DIGEST}"
          --health-url "${RAILWAY_DASHBOARD_URL%/}/healthz"
          --health-url "${RAILWAY_DASHBOARD_URL%/}/readyz"
          --receipt "${RUNNER_TEMP}/railway-receipts/dashboard.json"
      - name: Restore the previous Railway deployment set
        if: failure() || cancelled()
        run: |
          rollback_failed=0
          rollback_service() {
            receipt="$1"
            [[ -f "${receipt}" ]] || return 0
            [[ "$(jq -r '.changed' "${receipt}")" == "true" ]] || return 0

            service="$(jq -r '.service' "${receipt}")"
            profile="$(jq -r '.profile' "${receipt}")"
            previous_image="$(jq -r '.previousImage // empty' "${receipt}")"
            previous_digest="$(jq -r '.previousDigest // empty' "${receipt}")"
            base="$(basename "${receipt}" .json)"
            if [[ -z "${previous_image}" || -z "${previous_digest}" ]]; then
              railway down \
                --project "${RAILWAY_PROJECT_ID}" \
                --environment "${RAILWAY_ENVIRONMENT_ID}" \
                --service "${service}" --yes || rollback_failed=1
              return 0
            fi

            health_args=()
            force_args=()
            if [[ "${profile}" == "realm" ]]; then
              force_args=(--force true)
            fi
            while IFS= read -r url; do
              health_args+=(--health-url "${url}")
            done < <(jq -r '.healthUrls[]' "${receipt}")
            deno run \
              --allow-env --allow-net --allow-run \
              --allow-write="${RUNNER_TEMP}/railway-receipts" \
              scripts/railway-rollout.ts \
              --project "${RAILWAY_PROJECT_ID}" \
              --environment "${RAILWAY_ENVIRONMENT_ID}" \
              --service "${service}" \
              --profile "${profile}" \
              --image "${previous_image}" \
              --digest "${previous_digest}" \
              "${force_args[@]}" \
              "${health_args[@]}" \
              --receipt "${RUNNER_TEMP}/railway-receipts/rollback-${base}.json" \
              || rollback_failed=1
          }

          rollback_service "${RUNNER_TEMP}/railway-receipts/sabledb.json"
          rollback_service "${RUNNER_TEMP}/railway-receipts/dashboard.json"

          origin_receipt="${RUNNER_TEMP}/railway-receipts/browser-origin-before.json"
          if [[ -f "${origin_receipt}" ]]; then
            previous_issuer="$(jq -r '.AUTH_ISSUER' "${origin_receipt}")"
            previous_origin="$(jq -r '.WEBAUTHN_RP_ORIGIN' "${origin_receipt}")"
            previous_rp_id="$(jq -r '.WEBAUTHN_RP_ID' "${origin_receipt}")"
            railway variable set \
              --project "${RAILWAY_PROJECT_ID}" \
              --environment "${RAILWAY_ENVIRONMENT_ID}" \
              --service "${RAILWAY_API_SERVICE_ID}" \
              --skip-deploys --json \
              "AUTH_ISSUER=${previous_issuer}" \
              "WEBAUTHN_RP_ORIGIN=${previous_origin}" \
              "WEBAUTHN_RP_ID=${previous_rp_id}" >/dev/null \
              || rollback_failed=1
          fi

          if [[ -f "${RUNNER_TEMP}/railway-receipts/api-before-sable.json" ]]; then
            rollback_service "${RUNNER_TEMP}/railway-receipts/api-before-sable.json"
          else
            railway redeploy \
              --project "${RAILWAY_PROJECT_ID}" \
              --environment "${RAILWAY_ENVIRONMENT_ID}" \
              --service "${RAILWAY_API_SERVICE_ID}" \
              --from-source --yes --json >/dev/null \
              || rollback_failed=1
            recovered=false
            for attempt in {1..24}; do
              if curl --fail --silent --show-error \
                "${RAILWAY_API_URL%/}/readyz" \
                | jq --exit-status '.status == "ready" or .status == "ok"' >/dev/null; then
                recovered=true
                break
              fi
              if [[ "${attempt}" -lt 24 ]]; then
                sleep 5
              fi
            done
            [[ "${recovered}" == "true" ]] || rollback_failed=1
          fi
          exit "${rollback_failed}"
      - name: Show bounded deployment logs on failure
        if: failure() || cancelled()
        run: |
          for service in \
            "${RAILWAY_API_SERVICE_ID}" \
            "${RAILWAY_DASHBOARD_SERVICE_ID}" \
            "${RAILWAY_SABLEDB_SERVICE_ID}"; do
            railway logs --project "${RAILWAY_PROJECT_ID}" \
              --environment "${RAILWAY_ENVIRONMENT_ID}" \
              --service "${service}" --latest --deployment --lines 100 || true
          done
      - name: Retain deployment receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: railway-production-${{ needs.prepare.outputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/railway-receipts/*.json
          if-no-files-found: warn
          retention-days: 90

  sync-template:
    name: Publish the verified Railway template graph
    needs: [prepare, publish-api, publish-dashboard, publish-sabledb, deploy]
    if: needs.prepare.outputs.deploy == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: railway-production
    env:
      # Template publication needs workspace-owner authority; do not reuse the
      # project-scoped deployment token from the rollout job.
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TEMPLATE_TOKEN }}
      API_DIGEST: ${{ needs.publish-api.outputs.digest }}
      DASHBOARD_DIGEST: ${{ needs.publish-dashboard.outputs.digest }}
      SABLEDB_DIGEST: ${{ needs.publish-sabledb.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.9.3
      - name: Replace the public template with the verified image set
        run: >-
          deno run
          --allow-env=RAILWAY_API_TOKEN,RAILWAY_TEMPLATE_API_URL,RAILWAY_TEMPLATE_ID,RAILWAY_TEMPLATE_WORKSPACE_ID
          --allow-net=backboard.railway.com
          --allow-read=railway.template.json
          scripts/sync-railway-template.ts
          --api-image "ghcr.io/rusty-auth/rustyauth@${API_DIGEST}"
          --dashboard-image "ghcr.io/rusty-auth/dashboard@${DASHBOARD_DIGEST}"
          --sabledb-image "ghcr.io/rusty-auth/sabledb@${SABLEDB_DIGEST}"
