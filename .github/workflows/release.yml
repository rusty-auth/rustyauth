name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A retrigger for the same immutable tag supersedes its older attempt. Different
# release tags remain isolated so a newer release cannot interrupt publication of
# another version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify tag and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          versions=(
            "Cargo.toml:$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
            "console/Cargo.toml:$(grep -m1 '^version = ' console/Cargo.toml | cut -d'"' -f2)"
            "packages/client/deno.json:$(jq -r .version packages/client/deno.json)"
            "packages/protocol/deno.json:$(jq -r .version packages/protocol/deno.json)"
            "site/package.json:$(jq -r .version site/package.json)"
            "charts/rustyauth-integrated/Chart.yaml:$(awk '/^version:/ { print $2; exit }' charts/rustyauth-integrated/Chart.yaml)"
            "charts/rustyauth-fleet/Chart.yaml:$(awk '/^version:/ { print $2; exit }' charts/rustyauth-fleet/Chart.yaml)"
            "charts/rustyauth-realm/Chart.yaml:$(awk '/^version:/ { print $2; exit }' charts/rustyauth-realm/Chart.yaml)"
            "charts/rustyauth-integrated/Chart.yaml appVersion:$(awk '/^appVersion:/ { gsub(/\"/, \"\", $2); print $2; exit }' charts/rustyauth-integrated/Chart.yaml)"
            "charts/rustyauth-fleet/Chart.yaml appVersion:$(awk '/^appVersion:/ { gsub(/\"/, \"\", $2); print $2; exit }' charts/rustyauth-fleet/Chart.yaml)"
            "charts/rustyauth-realm/Chart.yaml appVersion:$(awk '/^appVersion:/ { gsub(/\"/, \"\", $2); print $2; exit }' charts/rustyauth-realm/Chart.yaml)"
          )
          for item in "${versions[@]}"; do
            file="${item%%:*}"
            version="${item#*:}"
            if [[ "${tag}" != "${version}" ]]; then
              echo "::error file=${file}::tag v${tag} does not match ${file} version ${version}"
              exit 1
            fi
          done
          for values_file in charts/*/values.yaml; do
            while IFS= read -r image_tag; do
              if [[ "${image_tag}" != "${GITHUB_REF_NAME}" ]]; then
                echo "::error file=${values_file}::default image tag ${image_tag} does not match ${GITHUB_REF_NAME}"
                exit 1
              fi
            done < <(awk '/^[[:space:]]+tag:/ { print $2 }' "${values_file}")
          done
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.9.3
      - run: deno install --frozen
      - name: Reviewed release evidence is complete
        run: deno task release:check "${GITHUB_REF_NAME#v}"
      - run: deno task connect:check
      - run: deno task connect:test
      - run: deno task connect:publish-dry
      - run: deno task docs:check
      - run: deno task gateway:check
      - run: deno task native:check
      - run: deno task railway:check
      - run: deno task railway:test
      - run: deno task release:test
      - run: deno task site:check
      - run: deno task site:test
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.0
      - run: scripts/check-helm.sh
      # The tagged artefact is what operators actually run, so it gets the same
      # supply-chain gate as a pull request. Without this a release could ship an
      # advisory that CI would have refused to merge.
      - name: Every advisory ignore is dated and unexpired
        run: |
          test -f deny.toml || { echo "::error::deny.toml is missing"; exit 1; }
          ignores="$(grep -c '{ *id *= *"RUSTSEC' deny.toml || true)"
          dated="$(grep -c '# expires: [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}' deny.toml || true)"
          if [[ "${ignores}" -ne "${dated}" ]]; then
            echo "::error file=deny.toml::${ignores} advisory ignores but ${dated} '# expires:' comments; every ignore needs one"
            exit 1
          fi
          today="$(date -u +%F)"
          status=0
          while IFS= read -r expiry; do
            if [[ "${expiry}" < "${today}" ]]; then
              echo "::error file=deny.toml::an advisory ignore expired on ${expiry}"
              status=1
            fi
          done < <(sed -n 's/.*# expires: \([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\).*/\1/p' deny.toml)
          exit "${status}"
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: 1.94.1
          command: check advisories bans licenses sources
          arguments: --all-features --locked
      - name: Audit independently locked Rust dependency graphs
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file console/Cargo.lock
          cargo audit --file sabledb/Cargo.lock

  qualification:
    name: Pinned-service release qualification
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build the pinned SableDB image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./sabledb/Dockerfile
          load: true
          tags: rustyauth-sabledb:ci
          cache-from: type=gha,scope=sabledb-image
          cache-to: type=gha,scope=sabledb-image,mode=max
      - name: Build the release-candidate API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: rustyauth:release-qualification
          cache-from: type=gha,scope=rustyauth-image
          cache-to: type=gha,scope=rustyauth-image,mode=max
      - name: Build the release-candidate dashboard image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.dashboard
          load: true
          tags: rustyauth-dashboard:release-qualification
          cache-from: type=gha,scope=dashboard-image
          cache-to: type=gha,scope=dashboard-image,mode=max
      - name: Install checksum-pinned image scanner
        run: ./scripts/install-trivy.sh "${RUNNER_TEMP}/trivy"
      - name: Reject HIGH or CRITICAL runtime image findings
        run: |
          scanner="${RUNNER_TEMP}/trivy/trivy"
          "${scanner}" image --quiet --scanners vuln --severity HIGH,CRITICAL --exit-code 1 rustyauth:release-qualification
          "${scanner}" image --quiet --scanners vuln --severity HIGH,CRITICAL --exit-code 1 rustyauth-dashboard:release-qualification
          "${scanner}" image --quiet --scanners vuln --severity HIGH,CRITICAL --exit-code 1 rustyauth-sabledb:ci
      - name: Run hardened scratch-runtime smoke qualification
        env:
          RUSTYAUTH_SMOKE_API_IMAGE: rustyauth:release-qualification
          RUSTYAUTH_SMOKE_DASHBOARD_IMAGE: rustyauth-dashboard:release-qualification
          RUSTYAUTH_SMOKE_SABLEDB_IMAGE: rustyauth-sabledb:ci
        run: ./scripts/qualify-runtime-images.sh
      - name: Start pinned SableDB, MinIO and GreptimeDB services
        run: >-
          docker compose -f compose.integration.yaml up -d --wait
          source-sabledb destination-sabledb minio greptimedb
      - name: Create the private integration bucket
        run: docker compose -f compose.integration.yaml run --rm minio-init
      - name: Run every live and end-to-end release gate
        env:
          RUSTYAUTH_TEST_SOURCE_SABLEDB_URL: redis://127.0.0.1:16379
          RUSTYAUTH_TEST_DESTINATION_SABLEDB_URL: redis://127.0.0.1:16380
          RUSTYAUTH_TEST_S3_ENDPOINT: http://127.0.0.1:19000
          RUSTYAUTH_TEST_S3_BUCKET: rustyauth-integration
          RUSTYAUTH_TEST_S3_ACCESS_KEY: rustyauth-test
          RUSTYAUTH_TEST_S3_SECRET_KEY: rustyauth-test-secret
          RUSTYAUTH_TEST_GREPTIME_URL: http://127.0.0.1:14000
          RUSTYAUTH_RUN_MEDIUM_ANALYTICS_QUALIFICATION: "1"
        run: cargo test --locked -- --ignored --nocapture --test-threads=1
      - name: Show service logs after failure
        if: failure()
        run: docker compose -f compose.integration.yaml logs
      - name: Stop integration services
        if: always()
        run: docker compose -f compose.integration.yaml down --volumes

  fuzz:
    name: Protocol fuzz qualification
    runs-on: ubuntu-latest
    needs: verify
    env:
      # Override rust-toolchain.toml for cargo-fuzz and every Cargo/rustc child it starts.
      RUSTUP_TOOLCHAIN: nightly-2026-08-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned fuzz toolchain
        run: rustup toolchain install nightly-2026-08-01 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fuzz run analytics_batch -- -max_total_time=30 -timeout=10
      - run: cargo fuzz run management_wire -- -max_total_time=30 -timeout=10
      - run: cargo fuzz run archive_manifest_json -- -max_total_time=30 -timeout=10

  publication-preflight:
    name: Publication registry preflight
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: JSR packages exist and the target version is unused
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for package in protocol client; do
            metadata="$(curl --fail --silent --show-error \
              --header 'Accept: application/json' \
              "https://jsr.io/@rustyauth/${package}/meta.json")"
            jq --exit-status \
              --arg package "${package}" \
              '.scope == "rustyauth" and .name == $package' \
              <<<"${metadata}" >/dev/null
            if jq --exit-status --arg version "${version}" '.versions[$version] != null' \
              <<<"${metadata}" >/dev/null; then
              echo "::error::@rustyauth/${package} ${version} already exists on JSR"
              exit 1
            fi
          done
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: 1.72.0
          token: ${{ secrets.BUF_TOKEN }}
          setup_only: true
      - name: Buf token and destination module are ready
        run: |
          buf registry whoami
          buf registry module info buf.build/rusty-auth/rustyauth >/dev/null

  container:
    name: Publish Rust API container images
    runs-on: ubuntu-latest
    needs: [qualification, fuzz, publication-preflight]
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Single-platform for now: an emulated arm64 Rust release build multiplies release time
      # for a target no supported deployment uses yet. The cache scope is shared with CI's
      # container job, so a release normally reuses already-verified layers.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/rusty-auth/control-plane:${{ github.ref_name }}
            ghcr.io/rusty-auth/control-plane:latest
          cache-from: type=gha,scope=rustyauth-image
          cache-to: type=gha,scope=rustyauth-image,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign API and control-plane images by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
          cosign sign --yes "ghcr.io/rusty-auth/control-plane@${DIGEST}"

  dashboard-container:
    name: Publish Dioxus dashboard container image
    runs-on: ubuntu-latest
    needs: [qualification, fuzz, publication-preflight]
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/rusty-auth/dashboard:${{ github.ref_name }}
            ghcr.io/rusty-auth/dashboard:latest
          cache-from: type=gha,scope=dashboard-image
          cache-to: type=gha,scope=dashboard-image,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign dashboard image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/rusty-auth/dashboard@${DIGEST}"

  sabledb-container:
    name: Publish SableDB container image
    runs-on: ubuntu-latest
    needs: [qualification, fuzz, publication-preflight]
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tagged with the RustyAuth release version: the image is RustyAuth's build of the
      # pinned vendor/sabledb gitlink, and the pair are qualified together.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./sabledb/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/rusty-auth/sabledb:${{ github.ref_name }}
            ghcr.io/rusty-auth/sabledb:latest
          cache-from: type=gha,scope=sabledb-image
          cache-to: type=gha,scope=sabledb-image,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign SableDB image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/rusty-auth/sabledb@${DIGEST}"

  jsr:
    name: Publish TypeScript packages to JSR
    runs-on: ubuntu-latest
    needs: [qualification, fuzz, publication-preflight]
    permissions:
      contents: read
      id-token: write # JSR authenticates CI publishes with GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.9.3
      - run: deno install --frozen
      # Package versions move in lockstep with the release. A duplicate or failed publish
      # is a release failure, not a warning, because a successful tag promises both packages.
      - name: Publish @rustyauth/protocol
        working-directory: packages/protocol
        run: deno publish
      - name: Publish @rustyauth/client
        working-directory: packages/client
        run: deno publish

  bsr:
    name: Publish Protobuf module to BSR
    runs-on: ubuntu-latest
    needs: [qualification, fuzz, publication-preflight]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: 1.72.0
          token: ${{ secrets.BUF_TOKEN }}
          lint: true
          format: true
          breaking: false
          push: true

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [container, dashboard-container, sabledb-container, jsr, bsr]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.0
      - name: Package Helm charts
        run: |
          mkdir -p dist
          for chart in charts/rustyauth-integrated charts/rustyauth-fleet charts/rustyauth-realm; do
            helm package "${chart}" --destination dist
          done
          (
            cd dist
            sha256sum ./*.tgz > SHA256SUMS
          )
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tgz dist/SHA256SUMS \
            --title "RustyAuth ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Full details in [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md). Images: \`ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}\`, \`ghcr.io/rusty-auth/control-plane:${GITHUB_REF_NAME}\`, \`ghcr.io/rusty-auth/dashboard:${GITHUB_REF_NAME}\`, and \`ghcr.io/rusty-auth/sabledb:${GITHUB_REF_NAME}\`. This release also includes version-matched integrated, Fleet and realm Helm chart archives plus \`SHA256SUMS\`."
