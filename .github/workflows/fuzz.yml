name: Protocol fuzzing

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protocol-fuzz:
    runs-on: ubuntu-latest
    env:
      # Override rust-toolchain.toml for cargo-fuzz and every Cargo/rustc child it starts.
      RUSTUP_TOOLCHAIN: nightly-2026-08-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned fuzz toolchain
        run: rustup toolchain install nightly-2026-08-01 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fuzz run analytics_batch -- -max_total_time=30 -timeout=10
      - run: cargo fuzz run management_wire -- -max_total_time=30 -timeout=10
      - run: cargo fuzz run archive_manifest_json -- -max_total_time=30 -timeout=10
