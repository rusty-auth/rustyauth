name: Protocol fuzzing

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "proto/**"
      - "src/analytics.rs"
      - "src/telemetry.rs"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-fuzz:
    runs-on: ubuntu-latest
    env:
      # Override rust-toolchain.toml for cargo-fuzz and every Cargo/rustc child it starts.
      RUSTUP_TOOLCHAIN: nightly-2026-08-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9
        with:
          toolchain: nightly-2026-08-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fuzz run analytics_batch -- -max_total_time=30 -timeout=10
      - run: cargo fuzz run management_wire -- -max_total_time=30 -timeout=10
      - run: cargo fuzz run archive_manifest_json -- -max_total_time=30 -timeout=10
