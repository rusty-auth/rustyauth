name: rustyauth-fleet

x-runtime-hardening: &runtime-hardening
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m

services:
  dashboard:
    <<: *runtime-hardening
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      PORT: 8080
      RUSTYAUTH_API_UPSTREAM: http://control-plane:8080
    ports:
      - "127.0.0.1:${FLEET_DASHBOARD_PORT:-5196}:8080"
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/container-healthcheck", "http", "127.0.0.1:8080", "/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private, edge]

  control-plane:
    <<: *runtime-hardening
    build:
      context: .
      dockerfile: Dockerfile
    configs:
      - source: rustyauth_config
        target: /etc/rustyauth/config.yaml
    environment:
      AUTH_MASTER_KEY_HEX: ${FLEET_AUTH_MASTER_KEY_HEX:?set it in the Fleet env file; scripts/local-stack generates one}
      BOOTSTRAP_TOKEN: ${FLEET_BOOTSTRAP_TOKEN:?set it in the Fleet env file; scripts/local-stack generates one}
      RUST_LOG: ${RUST_LOG:-rustyauth=info,tower_http=info}
    expose: ["8080"]
    depends_on:
      fleet-sabledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/rustyauth", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private]

  fleet-sabledb:
    <<: *runtime-hardening
    # The entrypoint execs SableDB as PID 1 after dropping privilege; a root
    # signal-forwarding shim could not signal that non-root process.
    init: false
    # The image uses these only to prepare a newly attached root-owned volume,
    # then clears groups and drops to uid/gid 10002 before SableDB starts.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    build:
      context: .
      dockerfile: sabledb/Dockerfile
    volumes:
      - fleet_sabledb_data:/var/lib/sabledb
    healthcheck:
      test: ["CMD", "/usr/local/bin/container-healthcheck", "redis", "127.0.0.1:6379"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [private]

networks:
  private:
    internal: true
  edge:

configs:
  rustyauth_config:
    file: ${RUSTYAUTH_CONFIG_FILE:-./rustyauth.fleet.example.yaml}

volumes:
  fleet_sabledb_data:
