# yaml-language-server: $schema=../../schemas/rustyauth-config-v1alpha1.schema.json
apiVersion: rustyauth.dev/v1alpha1
kind: Realm

metadata:
  tenantId: payments
  realmId: payments-production

spec:
  environment: production

  server:
    bind: 0.0.0.0
    port: 8080
    publicIssuer: https://auth.example.com
    trustedProxyHops: 1

  datastore:
    endpoint: redis://realm-sabledb.railway.internal:6379

  relyingParty:
    id: app.example.com
    origin: https://app.example.com
    name: Example Account

  tokens:
    audience: payments-api
    accessTtl: 5m

  sessions:
    idleTimeout: 30m
    absoluteTimeout: 7d

  signingKeys:
    rotateEvery: 30d
    prepublishFor: 10m
    overlapFor: 10m
    maintenanceInterval: 30s

  operators:
    bootstrapEmails:
      - admin@example.com

  # Stable IDs make these desired-state resources reconcilable. Config-managed
  # destinations are read-only in the dashboard; update this file and redeploy.
  webhooks:
    - id: application-lifecycle
      name: Application lifecycle
      endpoint: https://api.example.com/hooks/rustyauth
      enabled: true
      eventTypes:
        - identity.created
        - profile.updated
        - session.created
        - session.revoked

  backups:
    enabled: true
    destination:
      endpoint: https://s3.eu-west-2.amazonaws.com
      region: eu-west-2
      bucket: example-rustyauth-backups
      urlStyle: virtual
      serverSideEncryption:
        mode: aws-kms
        # Use the exact key ID returned by GetObject; the AWS stack outputs this ARN.
        kmsKeyId: arn:aws:kms:eu-west-2:123456789012:key/00000000-0000-0000-0000-000000000000
    schedule:
      interval: 6h
      recoveryPointObjective: 6h
    retention: 90d
    alertAfterFailures: 2
