[package]
name = "rustyauth-console"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"
description = "Cross-platform RustyAuth fleet management console"
publish = false

[dependencies]
base64 = "=0.22.1"
buffa = { version = "=0.8.1", features = ["json"] }
connectrpc = { version = "=0.8.1", default-features = false }
dioxus = { version = "=0.7.10", default-features = false, features = ["launch", "lib"] }
dx_icons_tabler = "=0.1.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
time = { version = "=0.3.55", features = ["formatting"] }
uuid = { version = "=1.24.0", features = ["js", "v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
serde-wasm-bindgen = "=0.6.5"
web-sys = { version = "=0.3.104", features = [
    "Credential",
    "CredentialsContainer",
    "Headers",
    "History",
    "Location",
    "Navigator",
    "PublicKeyCredential",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
] }

[target.'cfg(all(not(target_arch = "wasm32"), not(any(target_os = "ios", target_os = "android"))))'.dependencies]
keyring = { version = "=4.1.6", default-features = false, features = ["v1"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["protected"] }
keyring-core = "=1.0.0"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"
keyring-core = "=1.0.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["http2", "rustls-tls"] }

[build-dependencies]
connectrpc-build = "=0.8.0"
protoc-bin-vendored = "=3.2.0"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
bundle = []

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
