name: rustyauth

x-runtime-hardening: &runtime-hardening
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m

services:
  dashboard:
    <<: *runtime-hardening
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      PORT: 8080
      RUSTYAUTH_API_UPSTREAM: http://auth:8080
    ports:
      - "127.0.0.1:${STANDALONE_DASHBOARD_PORT:-8081}:8080"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/container-healthcheck", "http", "127.0.0.1:8080", "/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private, edge]

  auth:
    <<: *runtime-hardening
    build:
      context: .
      dockerfile: Dockerfile
    configs:
      - source: rustyauth_config
        target: /etc/rustyauth/config.yaml
    environment:
      # No defaults. A committed default is a published secret, and the entropy check
      # in src/config.rs cannot tell a generated key from a public one — so compose
      # refuses to start rather than substituting a value anyone can read in git.
      # Populate .env first; `docker compose up` reads it automatically.
      AUTH_MASTER_KEY_HEX: ${AUTH_MASTER_KEY_HEX:?set it in .env, e.g. openssl rand -hex 32}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?set it in .env, e.g. openssl rand -base64 48}
      AUTH_EVENT_RPC_TOKEN: ${AUTH_EVENT_RPC_TOKEN:?set it in .env, e.g. openssl rand -base64 48}
      AUTH_IDENTITY_RPC_TOKEN: ${AUTH_IDENTITY_RPC_TOKEN:?set it in .env, e.g. openssl rand -base64 48}
      RUST_LOG: ${RUST_LOG:-rustyauth=info,tower_http=info}
    expose: ["8080"]
    depends_on:
      sabledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/rustyauth", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private]

  sabledb:
    <<: *runtime-hardening
    build:
      context: .
      dockerfile: sabledb/Dockerfile
    volumes:
      - sabledb_data:/var/lib/sabledb
    healthcheck:
      test: ["CMD", "/usr/local/bin/container-healthcheck", "redis", "127.0.0.1:6379"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [private]

networks:
  private:
    internal: true
  edge:

configs:
  rustyauth_config:
    file: ${RUSTYAUTH_CONFIG_FILE:-./rustyauth.example.yaml}

volumes:
  sabledb_data:
