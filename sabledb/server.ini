[general]
public_address = 0.0.0.0:6379
private_address = 0.0.0.0:7379
workers = 0
log_level = info
logdir = ""
db_path = "/var/lib/sabledb/data/sabledb.db"
config_dir = "/var/lib/sabledb/conf"

[cron]
evict_orphan_records_secs = 3600
compaction_after_eviction = false
scan_keys_secs = 60
instant_delete = true
cluster_database_updates_interval_ms = 500
cron_interval_ms = 100

[client_limits]
client_response_buffer_size = 1MB

[replication_limits]
single_update_buffer_size = 50MB
num_updates_per_message = 1M
check_for_updates_interval_ms = 50

[rocksdb]
disable_wal = false
enable_pipelined_write = true
bloom_filter_bits_per_key = 10
compression_enabled = true
write_buffer_size = 16MB
max_background_jobs = 2
max_write_buffer_number = 2
wal_ttl_seconds = 86400
manual_wal_flush = false
manual_wal_flush_interval_ms = 250
max_open_files = 1024
min_write_buffer_number_to_merge = 1
allow_mmap_reads = false
allow_mmap_writes = false
