[general]
public_address = 0.0.0.0:6379
private_address = 0.0.0.0:7379
# RustyAuth opens four independent datastore connections. Matching them with
# four workers avoids placing two connection queues behind each Sable worker.
workers = 4
pin_workers = true
log_level = info
logdir = ""
db_path = "/var/lib/sabledb/data/sabledb.db"
config_dir = "/var/lib/sabledb/conf"

[cron]
evict_orphan_records_secs = 3600
compaction_after_eviction = false
scan_keys_secs = 60
instant_delete = true
cluster_database_updates_interval_ms = 500
cron_interval_ms = 100

[client_limits]
client_response_buffer_size = 1MB

[replication_limits]
single_update_buffer_size = 50MB
num_updates_per_message = 1M
check_for_updates_interval_ms = 50

[rocksdb]
disable_wal = false
enable_pipelined_write = true
bloom_filter_bits_per_key = 10
compression_enabled = true
# The supported lightweight chart keeps its hot session/account working set in
# memory while leaving bounded headroom inside the default 512MiB Sable limit.
# RocksDB's implicit 8MB block cache caused random point reads to fall through to
# persistent volumes even while the service had available memory.
block_cache_size = 128MB
write_buffer_size = 32MB
max_background_jobs = 2
max_write_buffer_number = 3
# RustyAuth supports one durable SableDB writer per realm and does not use
# RocksDB's archived WAL as a replication feed. A non-zero TTL archives every
# obsolete WAL until the TTL expires; under normal account/session transactions
# that can consume tens of gigabytes while the live dataset is only megabytes.
# Zero keeps crash recovery for the active WAL but deletes obsolete WALs as soon
# as RocksDB no longer needs them.
wal_ttl_seconds = 0
manual_wal_flush = false
manual_wal_flush_interval_ms = 250
max_open_files = 1024
min_write_buffer_number_to_merge = 2
allow_mmap_reads = false
allow_mmap_writes = false
